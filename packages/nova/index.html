<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Nova</title>
    <!-- Inline data-URI favicon: the DE1's web server (and the dev server) has no
         favicon.ico, so the browser's automatic request 404s. An inlined SVG
         keeps the build self-contained (single-file) and needs no extra file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ctext%20y='14'%20font-size='14'%3E%E2%98%95%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <!-- main.js side-effect-imports the shared core (window.NSXCore / NSXApi) in the
         order the core README prescribes, then mounts the Vue app. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
